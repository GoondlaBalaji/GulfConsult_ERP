name: CI/CD Pipeline - Gulf Consult ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Validate Schemas & Test Build (CI)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Validate (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ERP project/gc-erp/frontend"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ERP project/gc-erp/frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Verify SQL Scripts Integrity
        working-directory: .
        run: |
          echo "Verifying SQL Schema files..."
          for file in "SQL Scripts"/*.sql; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file ($(wc -l < "$file") lines)"
            else
              echo "✗ Missing SQL file: $file"
              exit 1
            fi
          done

      - name: Build Frontend Application for Production
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: "ERP project/gc-erp/frontend/dist"
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Automated Deployment to GitHub Pages (CD)
  # -------------------------------------------------------------
  deploy-github-pages:
    name: Deploy to GitHub Pages (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: "ERP project/gc-erp/frontend/dist"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "ERP project/gc-erp/frontend/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
